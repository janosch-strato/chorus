address: "http://localhost:9669" # Chorus proxy s3 api address
port: 9669
headBucketCache: enabled # answer a bucket existence check from the answer of the first one
readFromDestination: false # serve reads of already migrated objects from the replication destination instead of the source storage
destinationAnswerTimeout: 5s # how long such a read waits for the destination storage to answer, connecting to it included, before it is read from the source storage instead. reading the answer itself is not bounded by it. negative turns it off
destinationTimeoutLimit: 3 # how many reads in a row the destination storage may fail to answer in time before such reads are paused for destinationPause. negative turns the pausing off
destinationPause: 5m # how long reads stay on the source storage once the destination storage reached destinationTimeoutLimit. negative turns the pausing off
instanceID: # required. name of this proxy, unique among all proxies and kept across restarts. on startup the proxy finishes the deletes it left interrupted under this name
cors:
  enabled: false
  allowAll: false
  whitelist:
auth:
  allowV2Signature: false
  useStorage: # use credentials from one of configured storages <one|two>
  custom: # OR use custom credentials for proxy s3 endpoint
#    user1:
#      accessKeyID: <user1 v4 accessKey credential>
#      secretAccessKey: <user1 v4 secretKey credential>
#    user2:
#      accessKeyID: <user2 v4 accessKey credential>
#      secretAccessKey: <user2 v4 secretKey credential>
storage:
  createRouting: true # create roting rules to route proxy requests to main storage
  createReplication: false  # create replication rules to replicate data from main to other storages
  defaultRegion: "us-east-1" # fallback region. Will be used if origin region is not supported by replication destination
  storages:
